<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" fill="none" font-family="JetBrains Mono, SFMono-Regular, ui-monospace, monospace">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </linearGradient>

    <!-- reusable animated chip -->
    <g id="chip">
      <rect width="92" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4" />
    </g>
  </defs>

  <!-- ============ ROW 1 : LANGUAGES ============ -->
  <text x="104" y="40" text-anchor="end" font-size="9.5" fill="#8b949e" letter-spacing="1.4">LANGUAGES</text>

  <g transform="translate(120 18)">
    <g>
      <rect width="92" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="5s" begin="0s" repeatCount="indefinite" />
      </rect>
      <circle cx="14" cy="18" r="3" fill="#58a6ff">
        <animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin="0s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="22" font-size="11" font-weight="600" fill="#c9d1d9">TypeScript</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3.2s" begin="0s" repeatCount="indefinite" />
    </g>
  </g>

  <g transform="translate(222 18)">
    <g>
      <rect width="92" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="5s" begin="0.5s" repeatCount="indefinite" />
      </rect>
      <circle cx="14" cy="18" r="3" fill="#58a6ff">
        <animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin="0.3s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="22" font-size="11" font-weight="600" fill="#c9d1d9">JavaScript</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3.2s" begin="0.35s" repeatCount="indefinite" />
    </g>
  </g>

  <g transform="translate(324 18)">
    <g>
      <rect width="92" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="5s" begin="1s" repeatCount="indefinite" />
      </rect>
      <circle cx="14" cy="18" r="3" fill="#58a6ff">
        <animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin="0.6s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="22" font-size="11" font-weight="600" fill="#c9d1d9">PHP</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3.2s" begin="0.7s" repeatCount="indefinite" />
    </g>
  </g>

  <g transform="translate(426 18)">
    <g>
      <rect width="92" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="5s" begin="1.5s" repeatCount="indefinite" />
      </rect>
      <circle cx="14" cy="18" r="3" fill="#58a6ff">
        <animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin="0.9s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="22" font-size="11" font-weight="600" fill="#c9d1d9">SQL</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3.2s" begin="1.05s" repeatCount="indefinite" />
    </g>
  </g>

  <g transform="translate(528 18)">
    <g>
      <rect width="92" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="5s" begin="2s" repeatCount="indefinite" />
      </rect>
      <circle cx="14" cy="18" r="3" fill="#58a6ff">
        <animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="22" font-size="11" font-weight="600" fill="#c9d1d9">Lua</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3.2s" begin="1.4s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- ============ ROW 2 : FRONTEND ============ -->
  <text x="104" y="100" text-anchor="end" font-size="9.5" fill="#8b949e" letter-spacing="1.4">FRONTEND</text>

  <g transform="translate(120 78)">
    <g>
      <rect width="92" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="5s" begin="0.4s" repeatCount="indefinite" />
      </rect>
      <circle cx="14" cy="18" r="3" fill="#58a6ff">
        <animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin="0.2s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="22" font-size="11" font-weight="600" fill="#c9d1d9">Next.js</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3.6s" begin="0.2s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- React tile with a spinning atom mark -->
  <g transform="translate(222 78)">
    <g>
      <rect width="92" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="5s" begin="0.9s" repeatCount="indefinite" />
      </rect>
      <g transform="translate(16 18)">
        <g stroke="#58a6ff" stroke-width="1.1" fill="none">
          <ellipse rx="7.5" ry="3" />
          <ellipse rx="7.5" ry="3" transform="rotate(60)" />
          <ellipse rx="7.5" ry="3" transform="rotate(120)" />
        </g>
        <circle r="1.6" fill="#c9d1d9" />
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite" additive="sum" />
      </g>
      <text x="30" y="22" font-size="11" font-weight="600" fill="#c9d1d9">React</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3.6s" begin="0.55s" repeatCount="indefinite" />
    </g>
  </g>

  <g transform="translate(324 78)">
    <g>
      <rect width="92" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="5s" begin="1.4s" repeatCount="indefinite" />
      </rect>
      <!-- tailwind-ish double wave that redraws itself -->
      <path d="M 8 20 c 3 -5 6 -5 9 0 c 3 5 6 5 9 0" stroke="#58a6ff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-dasharray="30" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" values="30;0" dur="2.4s" repeatCount="indefinite" />
      </path>
      <text x="32" y="22" font-size="11" font-weight="600" fill="#c9d1d9">Tailwind</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3.6s" begin="0.9s" repeatCount="indefinite" />
    </g>
  </g>

  <g transform="translate(426 78)">
    <g>
      <rect width="122" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="5s" begin="1.9s" repeatCount="indefinite" />
      </rect>
      <circle cx="14" cy="18" r="3" fill="#58a6ff">
        <animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin="1.5s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="22" font-size="11" font-weight="600" fill="#c9d1d9">React Native</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3.6s" begin="1.25s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- ============ ROW 3 : BACKEND ============ -->
  <text x="104" y="160" text-anchor="end" font-size="9.5" fill="#8b949e" letter-spacing="1.4">BACKEND</text>

  <!-- Node tile with pulsing hexagon -->
  <g transform="translate(120 138)">
    <g>
      <rect width="92" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="5s" begin="0.2s" repeatCount="indefinite" />
      </rect>
      <g transform="translate(16 18)">
        <polygon points="0,-8 7,-4 7,4 0,8 -7,4 -7,-4" fill="none" stroke="#58a6ff" stroke-width="1.3">
          <animate attributeName="stroke-opacity" values="1;.35;1" dur="2.2s" repeatCount="indefinite" />
        </polygon>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="14s" repeatCount="indefinite" additive="sum" />
      </g>
      <text x="30" y="22" font-size="11" font-weight="600" fill="#c9d1d9">Node</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3.4s" begin="0.15s" repeatCount="indefinite" />
    </g>
  </g>

  <g transform="translate(222 138)">
    <g>
      <rect width="92" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="5s" begin="0.7s" repeatCount="indefinite" />
      </rect>
      <circle cx="14" cy="18" r="3" fill="#58a6ff">
        <animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin="0.45s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="22" font-size="11" font-weight="600" fill="#c9d1d9">Express</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3.4s" begin="0.5s" repeatCount="indefinite" />
    </g>
  </g>

  <g transform="translate(324 138)">
    <g>
      <rect width="92" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="5s" begin="1.2s" repeatCount="indefinite" />
      </rect>
      <circle cx="14" cy="18" r="3" fill="#58a6ff">
        <animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin="0.75s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="22" font-size="11" font-weight="600" fill="#c9d1d9">Laravel</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3.4s" begin="0.85s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- Socket.IO tile with travelling packet -->
  <g transform="translate(426 138)">
    <g>
      <rect width="106" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="5s" begin="1.7s" repeatCount="indefinite" />
      </rect>
      <line x1="10" y1="18" x2="22" y2="18" stroke="#30363d" stroke-width="1.2" />
      <circle cy="18" r="2.4" fill="#58a6ff">
        <animate attributeName="cx" values="10;22;10" dur="1.6s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="22" font-size="11" font-weight="600" fill="#c9d1d9">Socket.IO</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3.4s" begin="1.2s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- ============ ROW 4 : DATA ============ -->
  <text x="104" y="220" text-anchor="end" font-size="9.5" fill="#8b949e" letter-spacing="1.4">DATA</text>

  <g transform="translate(120 198)">
    <g>
      <rect width="92" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="5s" begin="0.6s" repeatCount="indefinite" />
      </rect>
      <!-- stacked db discs -->
      <g transform="translate(15 18)" stroke="#58a6ff" stroke-width="1.1" fill="none">
        <ellipse cy="-5" rx="6" ry="2.4" />
        <ellipse cy="0" rx="6" ry="2.4"><animate attributeName="stroke-opacity" values=".4;1;.4" dur="2s" repeatCount="indefinite" /></ellipse>
        <ellipse cy="5" rx="6" ry="2.4"><animate attributeName="stroke-opacity" values="1;.4;1" dur="2s" repeatCount="indefinite" /></ellipse>
      </g>
      <text x="28" y="22" font-size="11" font-weight="600" fill="#c9d1d9">MySQL</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3s" begin="0.3s" repeatCount="indefinite" />
    </g>
  </g>

  <g transform="translate(222 198)">
    <g>
      <rect width="92" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="5s" begin="1.1s" repeatCount="indefinite" />
      </rect>
      <circle cx="14" cy="18" r="3" fill="#58a6ff">
        <animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin="0.55s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="22" font-size="11" font-weight="600" fill="#c9d1d9">SQLite</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3s" begin="0.65s" repeatCount="indefinite" />
    </g>
  </g>

  <g transform="translate(324 198)">
    <g>
      <rect width="98" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="5s" begin="1.6s" repeatCount="indefinite" />
      </rect>
      <!-- mongo leaf -->
      <path d="M 15 11 c 4 4 4 10 0 14 c -4 -4 -4 -10 0 -14 z" fill="none" stroke="#58a6ff" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="1;.4;1" dur="2.6s" repeatCount="indefinite" />
      </path>
      <text x="28" y="22" font-size="11" font-weight="600" fill="#c9d1d9">MongoDB</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3s" begin="1s" repeatCount="indefinite" />
    </g>
  </g>

  <g transform="translate(432 198)">
    <g>
      <rect width="96" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="5s" begin="2.1s" repeatCount="indefinite" />
      </rect>
      <!-- firebase flame -->
      <path d="M 15 11 l 5 7 l -5 7 l -5 -7 z" fill="none" stroke="#58a6ff" stroke-width="1.2">
        <animateTransform attributeName="transform" type="scale" values="1 1; 1 0.82; 1 1" dur="1.4s" repeatCount="indefinite" additive="sum" />
      </path>
      <text x="28" y="22" font-size="11" font-weight="600" fill="#c9d1d9">Firebase</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3s" begin="1.35s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- ============ ROW 5 : DELIVERY ============ -->
  <text x="104" y="280" text-anchor="end" font-size="9.5" fill="#8b949e" letter-spacing="1.4">DELIVERY</text>

  <!-- git tile with branching graph -->
  <g transform="translate(120 258)">
    <g>
      <rect width="92" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="5s" begin="0.3s" repeatCount="indefinite" />
      </rect>
      <g stroke="#58a6ff" stroke-width="1.2" fill="none">
        <path d="M 10 22 L 10 14 M 10 18 C 14 18 16 14 20 14" />
      </g>
      <circle cx="10" cy="23" r="1.8" fill="#58a6ff">
        <animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="21" cy="14" r="1.8" fill="#c9d1d9">
        <animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="22" font-size="11" font-weight="600" fill="#c9d1d9">Git</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3.8s" begin="0.1s" repeatCount="indefinite" />
    </g>
  </g>

  <g transform="translate(222 258)">
    <g>
      <rect width="92" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="5s" begin="0.8s" repeatCount="indefinite" />
      </rect>
      <circle cx="14" cy="18" r="3" fill="#58a6ff">
        <animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin="0.85s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="22" font-size="11" font-weight="600" fill="#c9d1d9">Linux</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3.8s" begin="0.45s" repeatCount="indefinite" />
    </g>
  </g>

  <g transform="translate(324 258)">
    <g>
      <rect width="92" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="5s" begin="1.3s" repeatCount="indefinite" />
      </rect>
      <!-- vercel triangle -->
      <path d="M 15 12 l 7 12 l -14 0 z" fill="#58a6ff">
        <animate attributeName="opacity" values="1;.4;1" dur="2.8s" repeatCount="indefinite" />
      </path>
      <text x="28" y="22" font-size="11" font-weight="600" fill="#c9d1d9">Vercel</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3.8s" begin="0.8s" repeatCount="indefinite" />
    </g>
  </g>

  <g transform="translate(426 258)">
    <g>
      <rect width="92" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="5s" begin="1.8s" repeatCount="indefinite" />
      </rect>
      <circle cx="14" cy="18" r="3" fill="#58a6ff">
        <animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin="1.15s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="22" font-size="11" font-weight="600" fill="#c9d1d9">Postman</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3.8s" begin="1.15s" repeatCount="indefinite" />
    </g>
  </g>

  <g transform="translate(528 258)">
    <g>
      <rect width="92" height="36" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="5s" begin="2.3s" repeatCount="indefinite" />
      </rect>
      <circle cx="14" cy="18" r="3" fill="#58a6ff">
        <animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin="1.45s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="22" font-size="11" font-weight="600" fill="#c9d1d9">Vite</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3.8s" begin="1.5s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- scanning light sweep over the whole grid -->
  <rect y="0" width="90" height="330" fill="url(#sweep)">
    <animate attributeName="x" values="-90;660" dur="6s" repeatCount="indefinite" />
  </rect>
</svg>
