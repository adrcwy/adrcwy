<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 170" width="900" height="170" fill="none">
  <defs>
    <path id="orbitPath" d="M 450 85 m -70 0 a 70 26 0 1 0 140 0 a 70 26 0 1 0 -140 0" />
  </defs>

  <!-- ============ ROCKET (left, lifting off with flickering flame) ============ -->
  <g transform="translate(110 92)">
    <g>
      <!-- body -->
      <path d="M 0 -34 C 11 -20 13 0 11 18 L -11 18 C -13 0 -11 -20 0 -34 Z" fill="#c9d1d9" />
      <!-- window -->
      <circle cx="0" cy="-9" r="4.6" fill="#0d1117" />
      <circle cx="0" cy="-9" r="3" fill="#58a6ff">
        <animate attributeName="opacity" values=".45;1;.45" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <!-- fins -->
      <path d="M -11 4 L -21 20 L -11 18 Z" fill="#58a6ff" />
      <path d="M 11 4 L 21 20 L 11 18 Z" fill="#58a6ff" />
      <!-- flame -->
      <g>
        <path d="M -6 19 L 0 38 L 6 19 Z" fill="#58a6ff">
          <animate attributeName="d" values="M -6 19 L 0 38 L 6 19 Z; M -6 19 L 0 27 L 6 19 Z; M -6 19 L 0 41 L 6 19 Z; M -6 19 L 0 31 L 6 19 Z; M -6 19 L 0 38 L 6 19 Z" dur="0.55s" repeatCount="indefinite" />
          <animate attributeName="opacity" values=".95;.5;.95" dur="0.35s" repeatCount="indefinite" />
        </path>
        <path d="M -3 19 L 0 29 L 3 19 Z" fill="#c9d1d9" opacity=".85">
          <animate attributeName="opacity" values=".85;.35;.85" dur="0.28s" repeatCount="indefinite" />
        </path>
      </g>
      <!-- hover -->
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 -8; 0 6" dur="3.6s" repeatCount="indefinite" />
    </g>
    <!-- rising smoke puffs -->
    <g fill="#30363d">
      <circle cx="-4" cy="44" r="3.4">
        <animate attributeName="cy" values="44;70" dur="2.6s" repeatCount="indefinite" />
        <animate attributeName="opacity" values=".8;0" dur="2.6s" repeatCount="indefinite" />
      </circle>
      <circle cx="6" cy="44" r="2.6">
        <animate attributeName="cy" values="44;68" dur="2.6s" begin="0.9s" repeatCount="indefinite" />
        <animate attributeName="opacity" values=".7;0" dur="2.6s" begin="0.9s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="46" r="2">
        <animate attributeName="cy" values="46;72" dur="2.6s" begin="1.7s" repeatCount="indefinite" />
        <animate attributeName="opacity" values=".6;0" dur="2.6s" begin="1.7s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>

  <!-- ============ DRONE (spinning rotors, drifting side to side) ============ -->
  <g>
    <g transform="translate(280 78)">
      <g>
        <!-- arms -->
        <line x1="-22" y1="-6" x2="22" y2="-6" stroke="#30363d" stroke-width="2.4" />
        <!-- body -->
        <rect x="-11" y="-7" width="22" height="11" rx="3.5" fill="#c9d1d9" />
        <circle cx="0" cy="6" r="3.2" fill="#58a6ff">
          <animate attributeName="opacity" values="1;.2;1" dur="1.1s" repeatCount="indefinite" />
        </circle>
        <!-- legs -->
        <line x1="-7" y1="4" x2="-10" y2="12" stroke="#30363d" stroke-width="2" />
        <line x1="7" y1="4" x2="10" y2="12" stroke="#30363d" stroke-width="2" />
        <!-- rotors -->
        <g transform="translate(-22 -6)">
          <ellipse rx="11" ry="2" fill="#58a6ff" opacity=".75">
            <animate attributeName="rx" values="11;3;11" dur="0.22s" repeatCount="indefinite" />
          </ellipse>
        </g>
        <g transform="translate(22 -6)">
          <ellipse rx="11" ry="2" fill="#58a6ff" opacity=".75">
            <animate attributeName="rx" values="3;11;3" dur="0.22s" repeatCount="indefinite" />
          </ellipse>
        </g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 2; 0 0" dur="2.8s" repeatCount="indefinite" />
      </g>
      <animateTransform attributeName="transform" type="rotate" values="-5;5;-5" dur="4.4s" repeatCount="indefinite" additive="sum" />
    </g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 46 0; 0 0" dur="9s" repeatCount="indefinite" />
  </g>

  <!-- ============ SATELLITE ON ORBIT (center) ============ -->
  <g>
    <use xlink:href="#orbitPath" href="#orbitPath" stroke="#21262d" stroke-width="1.3" stroke-dasharray="4 7">
      <animate attributeName="stroke-dashoffset" values="0;-88" dur="6s" repeatCount="indefinite" />
    </use>
    <!-- planet -->
    <circle cx="450" cy="85" r="16" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="444" cy="79" r="3" fill="#30363d" />
    <circle cx="456" cy="90" r="2.2" fill="#30363d" />
    <circle cx="450" cy="85" r="22" fill="none" stroke="#58a6ff" stroke-width="1" opacity=".35">
      <animate attributeName="r" values="18;30" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values=".4;0" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <!-- satellite -->
    <g>
      <g>
        <rect x="-7" y="-2.6" width="14" height="5.2" rx="1.4" fill="#c9d1d9" />
        <rect x="-14" y="-1.2" width="6" height="2.6" fill="#58a6ff" />
        <rect x="8" y="-1.2" width="6" height="2.6" fill="#58a6ff" />
        <circle cx="0" cy="-5.4" r="1.5" fill="#58a6ff">
          <animate attributeName="opacity" values="1;.15;1" dur="1.3s" repeatCount="indefinite" />
        </circle>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="8s" repeatCount="indefinite" />
      </g>
      <animateMotion dur="12s" repeatCount="indefinite">
        <mpath xlink:href="#orbitPath" href="#orbitPath" />
      </animateMotion>
    </g>
  </g>

  <!-- ============ KITE (swaying on a string) ============ -->
  <g transform="translate(640 40)">
    <g>
      <!-- string -->
      <path d="M 0 26 C 8 52 -8 78 4 104" stroke="#30363d" stroke-width="1.2" fill="none">
        <animate attributeName="d" values="M 0 26 C 8 52 -8 78 4 104; M 0 26 C -8 52 8 78 -4 104; M 0 26 C 8 52 -8 78 4 104" dur="4s" repeatCount="indefinite" />
      </path>
      <!-- kite body -->
      <path d="M 0 -26 L 20 0 L 0 26 L -20 0 Z" fill="#161b22" stroke="#58a6ff" stroke-width="1.6" />
      <path d="M 0 -26 L 0 26 M -20 0 L 20 0" stroke="#30363d" stroke-width="1.2" />
      <path d="M 0 -26 L 20 0 L 0 0 Z" fill="#58a6ff" opacity=".3" />
      <!-- bows -->
      <circle cx="6" cy="56" r="2.4" fill="#58a6ff" opacity=".8" />
      <circle cx="-2" cy="82" r="2" fill="#8b949e" opacity=".8" />
      <animateTransform attributeName="transform" type="rotate" values="-9;9;-9" dur="4s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- ============ HOT AIR BALLOON (floating up slowly) ============ -->
  <g transform="translate(800 96)">
    <g>
      <path d="M 0 -30 C 17 -30 22 -14 16 2 C 12 12 4 18 0 18 C -4 18 -12 12 -16 2 C -22 -14 -17 -30 0 -30 Z" fill="#161b22" stroke="#8b949e" stroke-width="1.5" />
      <path d="M 0 -30 C 6 -18 6 4 0 18" stroke="#30363d" stroke-width="1.2" fill="none" />
      <path d="M 0 -30 C -6 -18 -6 4 0 18" stroke="#30363d" stroke-width="1.2" fill="none" />
      <path d="M -16 2 C -6 6 6 6 16 2" stroke="#58a6ff" stroke-width="1.4" fill="none" opacity=".7" />
      <line x1="-6" y1="18" x2="-4" y2="26" stroke="#30363d" stroke-width="1.1" />
      <line x1="6" y1="18" x2="4" y2="26" stroke="#30363d" stroke-width="1.1" />
      <rect x="-5" y="26" width="10" height="7" rx="1.5" fill="#c9d1d9" />
      <animateTransform attributeName="transform" type="translate" values="0 8; 0 -8; 0 8" dur="6.5s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- ============ tiny shooting star crossing everything ============ -->
  <g>
    <g>
      <line x1="0" y1="0" x2="26" y2="10" stroke="#58a6ff" stroke-width="1.6" stroke-linecap="round" opacity=".8" />
      <circle cx="0" cy="0" r="2.2" fill="#c9d1d9" />
    </g>
    <animateTransform attributeName="transform" type="translate" values="940 -20; -60 150" dur="5s" begin="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.62;0.9;1" dur="5s" begin="2s" repeatCount="indefinite" />
  </g>
</svg>
