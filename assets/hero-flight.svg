<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 150" width="1000" height="150" fill="none">
  <defs>
    <path id="flight" d="M -60 118 C 160 46 300 132 500 74 S 830 18 1060 46" />
    <path id="flight2" d="M -60 30 C 200 96 420 26 620 84 S 880 130 1060 96" />
  </defs>

  <!-- flight paths -->
  <use xlink:href="#flight" href="#flight" stroke="#30363d" stroke-width="1.4" stroke-dasharray="5 9">
    <animate attributeName="stroke-dashoffset" values="0;-140" dur="9s" repeatCount="indefinite" />
  </use>
  <use xlink:href="#flight2" href="#flight2" stroke="#21262d" stroke-width="1.2" stroke-dasharray="3 11">
    <animate attributeName="stroke-dashoffset" values="0;140" dur="12s" repeatCount="indefinite" />
  </use>

  <!-- twinkling stars -->
  <g fill="#8b949e">
    <circle cx="90" cy="38" r="1.8"><animate attributeName="opacity" values=".1;.9;.1" dur="3.1s" repeatCount="indefinite" /></circle>
    <circle cx="215" cy="22" r="1.4"><animate attributeName="opacity" values=".1;.8;.1" dur="4.3s" begin=".6s" repeatCount="indefinite" /></circle>
    <circle cx="350" cy="48" r="1.6"><animate attributeName="opacity" values=".1;1;.1" dur="2.7s" begin="1.2s" repeatCount="indefinite" /></circle>
    <circle cx="470" cy="18" r="1.3"><animate attributeName="opacity" values=".1;.7;.1" dur="3.8s" begin=".3s" repeatCount="indefinite" /></circle>
    <circle cx="640" cy="36" r="1.7"><animate attributeName="opacity" values=".1;.9;.1" dur="3.4s" begin="1.8s" repeatCount="indefinite" /></circle>
    <circle cx="780" cy="20" r="1.4"><animate attributeName="opacity" values=".1;.8;.1" dur="4.6s" begin=".9s" repeatCount="indefinite" /></circle>
    <circle cx="905" cy="44" r="1.6"><animate attributeName="opacity" values=".1;1;.1" dur="2.9s" begin="2.2s" repeatCount="indefinite" /></circle>
    <circle cx="150" cy="128" r="1.3"><animate attributeName="opacity" values=".1;.7;.1" dur="4.1s" begin="1.5s" repeatCount="indefinite" /></circle>
    <circle cx="720" cy="126" r="1.5"><animate attributeName="opacity" values=".1;.8;.1" dur="3.6s" begin=".4s" repeatCount="indefinite" /></circle>
  </g>

  <!-- drifting clouds -->
  <g stroke="#21262d" stroke-width="3" stroke-linecap="round" opacity=".9">
    <g>
      <line x1="0" y1="64" x2="34" y2="64" />
      <line x1="10" y1="73" x2="28" y2="73" />
      <animateTransform attributeName="transform" type="translate" values="-60 0;1060 0" dur="26s" repeatCount="indefinite" />
    </g>
    <g>
      <line x1="0" y1="104" x2="26" y2="104" />
      <line x1="8" y1="112" x2="20" y2="112" />
      <animateTransform attributeName="transform" type="translate" values="-60 0;1060 0" dur="34s" begin="6s" repeatCount="indefinite" />
    </g>
    <g>
      <line x1="0" y1="44" x2="30" y2="44" />
      <line x1="9" y1="52" x2="24" y2="52" />
      <animateTransform attributeName="transform" type="translate" values="-60 0;1060 0" dur="41s" begin="14s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- paper plane -->
  <g>
    <polygon points="-11,-7 14,0 -11,7 -5,0" fill="#58a6ff" />
    <polyline points="-11,-7 -5,0 -11,7" stroke="#0d1117" stroke-width="1" fill="none" />
    <animateMotion dur="11s" repeatCount="indefinite" rotate="auto">
      <mpath xlink:href="#flight" href="#flight" />
    </animateMotion>
  </g>

  <!-- vapour trail -->
  <g fill="#58a6ff">
    <circle r="2.6" opacity=".55">
      <animateMotion dur="11s" begin="-0.28s" repeatCount="indefinite"><mpath xlink:href="#flight" href="#flight" /></animateMotion>
    </circle>
    <circle r="2" opacity=".33">
      <animateMotion dur="11s" begin="-0.6s" repeatCount="indefinite"><mpath xlink:href="#flight" href="#flight" /></animateMotion>
    </circle>
    <circle r="1.5" opacity=".18">
      <animateMotion dur="11s" begin="-0.95s" repeatCount="indefinite"><mpath xlink:href="#flight" href="#flight" /></animateMotion>
    </circle>
  </g>

  <!-- little satellite drifting the other way -->
  <g>
    <g>
      <rect x="-9" y="-3" width="18" height="6" rx="1.5" fill="#8b949e" />
      <rect x="-15" y="-1.2" width="5" height="2.4" fill="#30363d" />
      <rect x="10" y="-1.2" width="5" height="2.4" fill="#30363d" />
      <circle cx="0" cy="-6" r="1.6" fill="#58a6ff">
        <animate attributeName="opacity" values="1;.15;1" dur="1.4s" repeatCount="indefinite" />
      </circle>
      <animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="6s" repeatCount="indefinite" />
    </g>
    <animateMotion dur="19s" repeatCount="indefinite">
      <mpath xlink:href="#flight2" href="#flight2" />
    </animateMotion>
  </g>
</svg>
